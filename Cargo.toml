[workspace]
members = ["crates/protocol", "crates/identity", "crates/discovery", "crates/relay", "crates/core", "services/relay", "apps/desktop/src-tauri"]
default-members = ["crates/protocol", "crates/identity", "crates/discovery", "crates/relay", "crates/core", "services/relay"]
resolver = "2"

[workspace.package]
version = "0.2.6"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
file-trans-protocol = { path = "crates/protocol" }
file-trans-identity = { path = "crates/identity" }
file-trans-discovery = { path = "crates/discovery" }
file-trans-core = { path = "crates/core" }
file-trans-relay = { path = "crates/relay" }
file-trans-relay-server = { path = "services/relay" }
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
